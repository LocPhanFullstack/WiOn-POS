<ng-container [ngSwitch]="step" class="tds-color-text-primary">
  <ng-container *ngSwitchCase="1">
    <wion-fnb-change-password-notification
      (approveChange)="approveChange($event)"
    ></wion-fnb-change-password-notification>
  </ng-container>
  <ng-container *ngSwitchCase="2">
    <wion-fnb-verify-new-password
      (completeChange)="completeChange($event)"
    ></wion-fnb-verify-new-password>
  </ng-container>
  <ng-container *ngSwitchCase="3">
    <div class="flex flex-col items-center justify-center p-6">
      <i
        class="tdsi-success-fill text-[50px] leading-[60px] tds-color-icon-success"
      ></i>
      <div class="w-full flex flex-col items-center justify-center mt-3">
        <div class="font-semibold tds-heading-5">Đổi mật khẩu thành công</div>
        <div class="tds-body-2 pt-1.5">
          Mật khẩu mới của tài khoản sẽ dùng để đăng nhập cho tất cả các ứng
          dụng trên WiAccount như WiOn POS, WiPoint, WiCo Check,..
        </div>
      </div>
      <div class="flex flex-row items-center justify-center pt-6">
        <button tds-button color="primary" type="button" (click)="logOut()">
          Đăng nhập lại
        </button>
      </div>
    </div>
  </ng-container>
</ng-container>
