<div
  class="w-full flex flex-col items-center justify-center tds-color-text-primary tds-body-2"
>
  <tds-illustration
    [tdsName]="iconName"
    [ngStyle]="{ 'width.px': iconWidth, 'height.px': iconHeight }"
  ></tds-illustration>
  <div [ngClass]="contentClass" class="w-full">
    <div class="max-w-full line-clamp-2 break-words whitespace-pre-line">
      Không có dữ liệu
      <span *ngIf="!!searchText">với từ khóa “{{ searchText }}”</span>
    </div>
  </div>
</div>
